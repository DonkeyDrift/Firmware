# Firmware CI：静态契约测试 + Arduino 编译矩阵（板 A / 板 B）。
#
# 为什么这么拆：
# - pytest tests/ 全是「读源码文本 + 正则断言」的静态契约测试，跑在纯 Python
#   上、秒级完成，是防协议/安全策略/版本号漂移的第一道闸；
# - 编译矩阵是唯一能证明「代码真的能编过」的步骤，必须有，但它要下载
#   esp32 core + 一堆 Arduino 库，耗时以分钟计，所以独立成 job 且与静态测试
#   并行跑（fail-fast: false，两边都出结果再看）。
name: Firmware CI

on:
  push:
  pull_request:

jobs:
  static-tests:
    name: Static contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MUS4_FW
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyserial pytest

      - name: Run static contract tests
        run: python -m pytest tests/ -q

  compile:
    name: Compile firmware (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: static-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: boardA
            define: ""
            bin_tag: boardA
          - profile: boardB
            define: "MUS4_BOARD_B"
            bin_tag: boardB
    defaults:
      run:
        working-directory: MUS4_FW
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyserial

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('MUS4_FW/config.yaml', 'MUS4_FW/sketch.yaml') }}
          restore-keys: |
            arduino-${{ runner.os }}-

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ${{ matrix.profile }}
        run: |
          if [ -n "${{ matrix.define }}" ]; then
            python arduino-cli.py -c --sketch MUS4_FW.ino \
              -D ${{ matrix.define }} --bin-tag ${{ matrix.bin_tag }}
          else
            python arduino-cli.py -c --sketch MUS4_FW.ino --bin-tag ${{ matrix.bin_tag }}
          fi

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: MUS4_FW_${{ matrix.bin_tag }}
          path: |
            MUS4_FW/build/MUS4_FW_${{ matrix.bin_tag }}.bin
            MUS4_FW/build/MUS4_FW.ino.bootloader.bin
            MUS4_FW/build/MUS4_FW.ino.merged.bin
          if-no-files-found: warn
