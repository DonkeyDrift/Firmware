<h2>Network 齿轮：按当前 tab 打开对应配置</h2>
<p class="subtitle">当前选择：AP tab → AP SSID 配置；STA tab → 保持现有 STA Wi-Fi 配置。</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">AP tab 下点击齿轮</div>
    <div class="mockup-body">
      <div style="background:#171c24;border:1px solid #344154;border-radius:12px;padding:16px;max-width:320px;position:relative">
        <div style="position:absolute;right:42px;top:10px;display:flex;gap:4px"><button class="mock-button" style="background:#5cc8ff;color:#061019">AP</button><button class="mock-button">STA</button></div>
        <button class="mock-button" style="position:absolute;right:10px;top:38px;border-radius:50%;width:34px;height:34px;padding:0">⚙</button>
        <div style="color:#8fa1b5;font-size:12px;text-transform:uppercase">Network</div>
        <div style="font-size:24px;font-weight:800;margin-top:8px">192.168.4.1</div>
        <div style="margin-top:10px;color:#8fa1b5;font-size:12px">SSID</div>
        <div style="font-weight:700">MUS4-DEBUG</div>
      </div>
      <div style="margin-top:18px;background:#121821;border:1px solid #ffcc66;border-radius:14px;padding:16px;max-width:360px">
        <h3 style="margin-top:0">AP SSID 配置</h3>
        <label style="display:block;color:#8fa1b5;margin-bottom:6px">SSID</label>
        <input class="mock-input" value="MUS4-DEBUG" style="width:100%;box-sizing:border-box">
        <p style="color:#b7c6d8;font-size:13px">保存后会持久化到 NVS，并重启 AP。当前浏览器连接会短暂断开，需要连接新 SSID 后刷新。</p>
        <div style="display:flex;justify-content:flex-end;gap:8px"><button class="mock-button">取消</button><button class="mock-button" style="background:#5cc8ff;color:#061019">保存并重启 AP</button></div>
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">STA tab 下点击齿轮</div>
    <div class="mockup-body">
      <div style="background:#171c24;border:1px solid #344154;border-radius:12px;padding:16px;max-width:320px;position:relative">
        <div style="position:absolute;right:42px;top:10px;display:flex;gap:4px"><button class="mock-button">AP</button><button class="mock-button" style="background:#5cc8ff;color:#061019">STA</button></div>
        <button class="mock-button" style="position:absolute;right:10px;top:38px;border-radius:50%;width:34px;height:34px;padding:0">⚙</button>
        <div style="color:#8fa1b5;font-size:12px;text-transform:uppercase">Network</div>
        <div style="font-size:24px;font-weight:800;margin-top:8px">192.168.3.144</div>
        <div style="margin-top:10px;color:#8fa1b5;font-size:12px">SSID</div>
        <div style="font-weight:700">HomeWiFi</div>
      </div>
      <div style="margin-top:18px;background:#121821;border:1px solid #ffcc66;border-radius:14px;padding:16px;max-width:360px">
        <h3 style="margin-top:0">STA Wi-Fi 配置</h3>
        <label style="display:block;color:#8fa1b5;margin-bottom:6px">SSID</label>
        <input class="mock-input" value="HomeWiFi" style="width:100%;box-sizing:border-box">
        <label style="display:block;color:#8fa1b5;margin:10px 0 6px">密码</label>
        <input class="mock-input" value="********" style="width:100%;box-sizing:border-box">
        <p style="color:#b7c6d8;font-size:13px">沿用现有 STA 扫描、密码显示、连接结果提示。</p>
        <div style="display:flex;justify-content:flex-end;gap:8px"><button class="mock-button">取消</button><button class="mock-button">清除</button><button class="mock-button" style="background:#5cc8ff;color:#061019">连接</button></div>
      </div>
    </div>
  </div>
</div>
