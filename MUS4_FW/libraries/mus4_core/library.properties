sentence=MUS4 core types, configuration macros, and runtime state.
paragraph=Foundational headers for the MUS4 firmware: compile-time configuration (FirmwareConfig.h), version metadata (BuildInfo.h), cross-module shared data structures (SharedTypes.h), Wi-Fi/OTA runtime state aggregation (RuntimeState.h + WifiConsoleTypes.h), serial buffer types, the String-based Print bridge, and the WirelessSecrets credential template. This library is the foundation; every other mus4_* library depends on it.
